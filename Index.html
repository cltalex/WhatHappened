<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="Spinner.css">
    <script src="Script.js" defer></script>

    <title>What Happened</title>
</head>

<body>
    <div class="header">
        <h1>What happened on your birthday<span>?</span></h1>
    </div>
    <div class="loading-container" id="loading-container" style="display:none">
        <div class="loading-text" id="loading-text"></div>
        <div class="ErrorText" id="error-text"></div>
        <div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
    </div>

    <div class="forum-container">
        <div class="forum-error-text" id="forum-error-text"></div>
        <input type="date" id="date-input"/>
        <div class="city-wrapper">
            <input type="text" id="cityInput" placeholder="Enter a city..." oninput="UpdateCitySuggestions()"/>
            <div class="city-suggestions" id="city-suggestions"></div>
        </div>
        <button class="submit-btn" id="submit-btn" onclick="GetData()"><span aria-hidden="true">&rarr;</span></button>
    </div>
    <footer>
        SOME stats are only sourced in the United States. Data may vary for other regions.
    </footer>
</body>
</html>
